[package]
name = "matchmaker"
version = "0.1.0"
edition = "2021"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
redis-rustclient = { path = "../../packages/redis-rustclient" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
dotenvy = "0.15"
actix = "0.13.5"
uuid = { version = "1.0", features = ["v4"] }
redis = { version = "0.27", features = ["tokio-rustls-comp"] }
bb8-redis = "0.18"
bb8 = "0.9"

fusion-blossom = "0.2.12"
metrics-rustclient = { path = "../../packages/metrics-rustclient" }
