name: Bootstrap ArgoCD

on:
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/bootstrap-argocd.yaml'
  workflow_dispatch:
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  bootstrap-argocd:
    name: Bootstrap ArgoCD on Cluster
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate GitOps credentials
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "Error: GITOPS_TOKEN is not configured in the production environment."
            exit 1
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: bhatvinay7/chess-k8s-1
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Configure kubectl
        env:
          KUBE_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBE_DATA" ]; then
            echo "Error: KUBECONFIG secret is not set!"
            exit 1
          fi
          mkdir -p ~/.kube
          
          # Check if the secret is plaintext YAML
          if printf "%s" "$KUBE_DATA" | grep -q "apiVersion:"; then
            printf "%s" "$KUBE_DATA" > ~/.kube/config
          else
            # Otherwise assume it's base64 encoded
            printf "%s" "$KUBE_DATA" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Install ArgoCD & Apply App of Apps
        run: |
          echo "Installing or repairing ArgoCD..."
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          # Server-side apply creates any resources missing from a partial installation.
          kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          # Wait a few seconds for CRDs to be fully registered
          sleep 10

          echo "Patching ArgoCD resources..."
          kubectl set resources deployment argocd-server -n argocd --limits=cpu=1000m,memory=1Gi --requests=cpu=250m,memory=256Mi
          kubectl set resources deployment argocd-repo-server -n argocd --limits=cpu=1000m,memory=1Gi --requests=cpu=250m,memory=256Mi
          
          echo "Installing cert-manager CRDs to prevent GitOps race conditions..."
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.crds.yaml
          
          echo "Installing cert-manager via Helm..."
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.13.2 \
            --set webhook.timeoutSeconds=10
            
          echo "Installing ingress-nginx with NodePort configuration..."
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --version 4.10.0 \
            --set controller.service.type=NodePort \
            --set controller.service.nodePorts.http=32080 \
            --set controller.service.nodePorts.https=32443 \
            --set controller.service.externalTrafficPolicy=Local \
            --set controller.metrics.enabled=true
          
          echo "Applying GitOps root App of Apps..."
          kubectl apply -k argocd
