name: Bootstrap ArgoCD

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/bootstrap-argocd.yaml"
  workflow_dispatch:
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  bootstrap-argocd:
    name: Bootstrap ArgoCD on Cluster
    # CI/CD uses production secrets for both application branches.
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate GitOps credentials
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "Error: GITOPS_TOKEN is not configured in the production environment."
            exit 1
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: bhatvinay7/chess-k8s-1
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest parser
        run: python3 -m pip install PyYAML==6.0.3
      - uses: azure/setup-helm@v4
      - name: Validate deployment images and namespaces
        run: python3 scripts/validate-monitoring.py --require-images dev
      - name: Configure kubectl
        env:
          KUBE_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBE_DATA" ]; then
            echo "Error: KUBECONFIG secret is not set!"
            exit 1
          fi
          mkdir -p ~/.kube

          # Check if the secret is plaintext YAML
          if printf "%s" "$KUBE_DATA" | grep -q "apiVersion:"; then
            printf "%s" "$KUBE_DATA" > ~/.kube/config
          else
            # Otherwise assume it's base64 encoded
            printf "%s" "$KUBE_DATA" | base64 -d > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Install ArgoCD & Apply App of Apps
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          echo "Installing or repairing ArgoCD..."
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          # Server-side apply creates any resources missing from a partial installation.
          kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          # Wait a few seconds for CRDs to be fully registered
          sleep 10

          echo "Registering the private GitOps repository with ArgoCD..."
          kubectl create secret generic chess-k8s-repository \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url=https://github.com/bhatvinay7/chess-k8s-1.git \
            --from-literal=username=bhatvinay7 \
            --from-literal=password="$GITOPS_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret chess-k8s-repository \
            --namespace argocd \
            argocd.argoproj.io/secret-type=repository \
            --overwrite

          echo "Patching ArgoCD resources..."
          kubectl set resources deployment argocd-server -n argocd --limits=cpu=1000m,memory=1Gi --requests=cpu=250m,memory=256Mi
          kubectl set resources deployment argocd-repo-server -n argocd --limits=cpu=1000m,memory=1Gi --requests=cpu=250m,memory=256Mi

          echo "Installing cert-manager CRDs to prevent GitOps race conditions..."
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.crds.yaml

          echo "Installing cert-manager via Helm..."
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.13.2 \
            --set webhook.timeoutSeconds=10

          echo "Installing ingress-nginx with NodePort configuration..."
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --version 4.10.0 \
            --set controller.service.type=NodePort \
            --set controller.service.nodePorts.http=32080 \
            --set controller.service.nodePorts.https=32443 \
            --set controller.service.externalTrafficPolicy=Local \
            --set controller.metrics.enabled=true

          python3 scripts/bootstrap-monitoring.py infra

          echo "Applying GitOps root App of Apps..."
          kubectl apply -k argocd

          echo "Verifying the Sealed Secrets Helm source..."
          EXPECTED_SEALED_SECRETS_REPO="https://bitnami.github.io/sealed-secrets"
          ACTUAL_SEALED_SECRETS_REPO=$(kubectl get application sealed-secrets \
            --namespace argocd \
            -o jsonpath='{.spec.source.repoURL}')

          if [ "$ACTUAL_SEALED_SECRETS_REPO" != "$EXPECTED_SEALED_SECRETS_REPO" ]; then
            echo "Error: sealed-secrets Application still uses $ACTUAL_SEALED_SECRETS_REPO"
            exit 1
          fi

          # Clear any cached Helm index/manifest error after a repository URL change.
          kubectl annotate application sealed-secrets \
            --namespace argocd \
            argocd.argoproj.io/refresh=hard \
            --overwrite
          echo "Sealed Secrets source updated and hard refresh requested."

          echo "Waiting for ArgoCD to create the Sealed Secrets controller..."
          kubectl wait --for=create deployment \
            --namespace kube-system \
            --selector=app.kubernetes.io/name=sealed-secrets \
            --timeout=120s
          kubectl wait --for=condition=Available deployment \
            --namespace kube-system \
            --selector=app.kubernetes.io/name=sealed-secrets \
            --timeout=180s
          echo "Sealed Secrets controller is available."

          # Wait until the Service has at least one endpoint address registered.
          # kubeseal --fetch-cert proxies through the API server; it fails with
          # "no endpoints available" until the Endpoints object is populated.
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            addrs=$(kubectl get endpoints sealed-secrets \
              -n kube-system \
              -o jsonpath='{.subsets[0].addresses}' 2>/dev/null || true)
            if [ -n "$addrs" ] && [ "$addrs" != 'null' ]; then
              echo "sealed-secrets-controller endpoint is ready."
              break
            fi
            echo "Waiting for sealed-secrets-controller endpoint..."
            sleep 5
          done

      - name: Install kubeseal
        run: |
          curl -fSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/kubeseal-0.27.1-linux-amd64.tar.gz" | tar xz
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal

      - name: Wait for controller certificate
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Established crd/sealedsecrets.bitnami.com --timeout=5m
          cert="$RUNNER_TEMP/sealed-secrets-cert.pem"
          # kubeseal --fetch-cert proxies through the API server HTTP handler which
          # is unreachable from GitHub runners. Read the cert directly from the
          # sealed-secrets-key Secret that the controller creates in kube-system.
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            tls_crt=$(kubectl get secret -n kube-system \
              -l sealedsecrets.bitnami.com/sealed-secrets-key=active \
              -o jsonpath='{.items[0].data.tls\.crt}' 2>/dev/null || true)
            if [ -n "$tls_crt" ] && [ "$tls_crt" != "null" ]; then
              printf '%s' "$tls_crt" | base64 --decode > "$cert"
              openssl x509 -in "$cert" -noout
              echo "SEALED_SECRETS_CERT_FILE=$cert" >> "$GITHUB_ENV"
              echo "Controller certificate written to $cert"
              exit 0
            fi
            echo "Waiting for sealed-secrets-key secret..."
            sleep 5
          done
          echo "Sealed Secrets controller certificate unavailable after 5 minutes"
          exit 1

      - name: Seal Secrets
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GRPC_SERVER_URL: ${{ secrets.GRPC_SERVER_URL }}
          INVITATION_ENCRYPTION_KEY: ${{ secrets.INVITATION_ENCRYPTION_KEY }}
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
          PUBLICATION: ${{ secrets.PUBLICATION }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REPLICATION_URL: ${{ secrets.REPLICATION_URL }}
          SLOT_NAME: ${{ secrets.SLOT_NAME }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_USE_REMOTE_STOCKFISH: ${{ secrets.NEXT_PUBLIC_USE_REMOTE_STOCKFISH }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "Error: GHCR_TOKEN is not set in the production environment."
            exit 1
          fi

          if [ -z "$SEALED_SECRETS_CERT_FILE" ] || [ ! -f "$SEALED_SECRETS_CERT_FILE" ]; then
            echo "Error: Sealed secrets certificate is missing."
            exit 1
          fi

          mkdir -p apps

          # Generate Backend Secrets
          kubectl create secret generic backend-secrets \
            --from-literal=CLOUDFLARE_R2_SECRET_ACCESS_KEY="$CLOUDFLARE_R2_SECRET_ACCESS_KEY" \
            --from-literal=CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
            --from-literal=CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
            --from-literal=CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=GRPC_SERVER_URL="$GRPC_SERVER_URL" \
            --from-literal=INVITATION_ENCRYPTION_KEY="$INVITATION_ENCRYPTION_KEY" \
            --from-literal=MONGO_DB_URL="$MONGO_DB_URL" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=RABBITMQ_URL="$RABBITMQ_URL" \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_PORT="$SMTP_PORT" \
            --from-literal=SMTP_SECURE="$SMTP_SECURE" \
            --from-literal=SMTP_USER="$SMTP_USER" \
            --from-literal=SMTP_PASS="$SMTP_PASS" \
            --from-literal=SMTP_FROM="$SMTP_FROM" \
            --from-literal=REPLICATION_URL="$REPLICATION_URL" \
            --from-literal=SLOT_NAME="$SLOT_NAME" \
            --from-literal=PUBLICATION="$PUBLICATION" \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=CLIENT_URL="$CLIENT_URL" \
            --dry-run=client -o yaml | kubeseal --cert "$SEALED_SECRETS_CERT_FILE" --format yaml > apps/sealed-backend-secrets.yaml
            
          # Generate Frontend Secrets
          kubectl create secret generic frontend-secrets \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --from-literal=NEXT_PUBLIC_SOCKET_URL="$NEXT_PUBLIC_SOCKET_URL" \
            --from-literal=NEXT_PUBLIC_R2_PUBLIC_URL="$NEXT_PUBLIC_R2_PUBLIC_URL" \
            --from-literal=NEXT_PUBLIC_USE_REMOTE_STOCKFISH="$NEXT_PUBLIC_USE_REMOTE_STOCKFISH" \
            --dry-run=client -o yaml | kubeseal --cert "$SEALED_SECRETS_CERT_FILE" --format yaml > apps/sealed-frontend-secrets.yaml

          # Generate a read-only GHCR pull secret for the application pods.
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubeseal --cert "$SEALED_SECRETS_CERT_FILE" --format yaml > apps/ghcr-secret.yaml

      - name: Commit and push GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/sealed-backend-secrets.yaml apps/sealed-frontend-secrets.yaml apps/ghcr-secret.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(secrets): seal secrets"
          for attempt in 1 2 3; do
            if git push origin "HEAD:main"; then
              exit 0
            fi
            git fetch origin main
            git rebase "origin/main"
          done
          echo "Could not push generated GitOps changes after three rebase attempts."
          exit 1
