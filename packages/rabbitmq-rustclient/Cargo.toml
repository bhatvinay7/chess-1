[package]
name = "rabbitmq-rustclient"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
lapin = { version = "2.3.1", features = ["rustls", "rustls-native-certs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[lib]
name = "rabbitmq_rustclient"
path = "src/lib.rs"
