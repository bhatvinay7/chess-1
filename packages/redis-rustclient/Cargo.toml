[package]
name = "redis-rustclient"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager", "streams", "script"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "redis_rustclient"
path = "src/lib.rs"
