  # ==========================================
  # NODE.JS / BUN SERVICES
  # ==========================================
  http-server:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - apps/http-server/.env
    depends_on:
      redis:
        condition: service_healthy

  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - apps/ws-server/.env
    depends_on:
      redis:
        condition: service_healthy

  # ==========================================
  # RUST SERVICES
  # ==========================================
  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    ports:
      - "50051:50051"
    env_file:
      - apps/game-server/.env
    depends_on:
      redis:
        condition: service_healthy

  sync-worker:
    build:
      context: .
      dockerfile: apps/sync-worker/Dockerfile
    env_file:
      - apps/sync-worker/.env
    depends_on:
      redis:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    env_file:
      - apps/notification-worker/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  matchmaker:
    build:
      context: .
      dockerfile: apps/matchmaker/Dockerfile
    env_file:
      - apps/matchmaker/.env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  rabbitmq_data:
